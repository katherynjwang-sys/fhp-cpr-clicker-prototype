<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pop Quiz</title>

    <link rel="stylesheet" href="popquiz.css">
</head>

<body>

    <div class="quiz-container">

        <div class="star">★</div>

        <div class="quiz-content">

            <h1>pop quiz </h1>


            <!-- Question 1 -->
            <div class="question active" data-answer="C">

                <p class="question-number">question 1 of 6</p>

                <h2>who is this?</h2>

                <img src="bo.png" alt="Bo Bragason">

                <button class="answer" data-choice="A">A. idk</button>
                <button class="answer" data-choice="B">B. katheryn</button>
                <button class="answer" data-choice="C">C. bo bragason</button>
                <button class="answer" data-choice="D">D. santa claus</button>

                <p class="feedback"></p>

                <button class="next-button">Next →</button>

            </div>

            <!-- Question 2 -->
            <div class="question" data-answer="ABC">

                <p class="question-number">question 2 of 6</p>

                <h2>what does katheryn do in her freetime?</h2>

                <button class="answer" data-choice="A">A. yearn</button>
                <button class="answer" data-choice="B">B. yearn</button>
                <button class="answer" data-choice="C">C. yearn</button>
                <button class="answer" data-choice="D">D. omg im not that yearnful</button>

                <p class="feedback"></p>

                <button class="next-button">Next →</button>

            </div>

            <!-- Question 3 -->
            <div class="question" data-answer="A">

                <p class="question-number">question 3 of 6</p>

                <h2>do you yearn?</h2>

                <button class="answer" data-choice="A">True</button>
                <button class="answer" data-choice="B">False</button>

                <p class="feedback"></p>

                <button class="next-button">Next →</button>

            </div>

            <!-- Question 4 -->
            <div class="question" data-answer="A">

                <p class="question-number">question 4 of 6</p>

                <h2>have you yearned?</h2>

                <button class="answer" data-choice="A">True</button>
                <button class="answer" data-choice="B">False</button>

                <p class="feedback"></p>

                <button class="next-button">Next →</button>

            </div>

            <!-- Question 5 -->
            <div class="question" data-answer="A">

                <p class="question-number">question 5 of 6</p>

                <h2>will you yearn?</h2>

                <button class="answer" data-choice="A">True</button>
                <button class="answer" data-choice="B">False</button>

                <p class="feedback"></p>

                <button class="next-button">Next →</button>

            </div>

            <!-- Question 6 -->
            <div class="question" data-answer="A">

                <p class="question-number">question 6 of 6</p>

                <h2>when will you yearn?</h2>

                <button class="answer" data-choice="A">yes</button>

                <p class="feedback"></p>

                <button class="next-button">See Results →</button>

            </div>

            <!-- Results -->
            <div class="results">

                <h2>quiz complete 😋</h2>

                <p id="score"></p>

                <p id="final-message"></p>

                <button id="reset-quiz" class="reset-button">
                    Reset Quiz
                </button>

                <a href="../index.html" class="home-button">
                    Home
                </a>

            </div>

        </div>

    </div>

    <script src="popquiz.js"></script>

</body>

</html>
