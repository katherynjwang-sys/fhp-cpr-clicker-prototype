<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Surprise Checklist</title>

    <link rel="stylesheet" href="laundry.css">
</head>

<body>

    <div class="laundry-container">

        <div class="star">★</div>

        <div class="laundry-content">

            <h1>how to do your laundry<br>(cuz some of u r a lil behind)</h1>


            <div class="checklist">

                <label>
                    <input type="checkbox">
                    <span>gather laundry</span>
                </label>

                <label>
                    <input type="checkbox">
                    <span>bring to machine</span>
                </label>

                <label>
                    <input type="checkbox">
                    <span>put in machine</span>
                </label>

                <label>
                    <input type="checkbox">
                    <span>put Tide in the machine place to put Tide</span>
                </label>

                <label>
                    <input type="checkbox">
                    <span>press on button</span>
                </label>

                <label>
                    <input type="checkbox">
                    <span>press go</span>
                </label>

            </div>

            <button id="reset-checklist" class="reset-button">
                Reset checklist
            </button>

            <a href="../index.html" class="home-button">
                Home
            </a>

        </div>

    </div>

    <script src="laundry.js"></script>

</body>

</html>
